<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ECLIPSE</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/menu.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="pause-dimmer" class="pause-dimmer hidden" aria-hidden="true"></div>

<div id="hud" class="hud hidden">
  <div class="hud-run">
    <span class="hud-wave">ВОЛНА 1</span>
    <span class="hud-time">0:00</span>
  </div>

  <div class="hud-dash-bar hud-bar">
    <span class="hud-label">DASH</span>
    <div class="hud-track dash-bar-track">
      <div class="hud-fill dash-bar-fill"></div>
    </div>
  </div>

  <div class="hud-health hud-bar">
    <div class="hud-track hp-track">
      <div class="hud-fill hp-fill"></div>
    </div>
    <span class="hp-current"></span>
    <span class="hp-max"></span>
  </div>

  <div class="hud-special">
    <div class="special-spires"></div>
  </div>
</div>

<!-- Главное меню -->
<div id="menu" class="screen">
  <div class="title-block">
    <div class="title-kicker">ALPHA VERSION</div>
    <h1 class="title">ECLIPSE</h1>
  </div>
  <nav class="menu-buttons">
    <button id="btn-play" class="menu-btn">Играть</button>
    <button id="btn-settings" class="menu-btn">Настройки</button>
    <button id="btn-exit" class="menu-btn">Выход</button>
  </nav>
</div>

<!-- Настройки -->
<div id="settings" class="screen settings-screen hidden">
  <h2 class="subtitle">Настройки</h2>
  <nav class="menu-buttons settings-actions settings-main-actions">
    <button id="btn-fullscreen" class="menu-btn">Полный экран</button>
    <button id="btn-back" class="menu-btn">Назад</button>
  </nav>
</div>

<div id="pause" class="screen hidden">
  <h2 class="subtitle">Пауза</h2>
  <nav class="menu-buttons">
    <button id="btn-resume" class="menu-btn">Продолжить</button>
    <button id="btn-pause-settings" class="menu-btn">Настройки</button>
    <button id="btn-pause-menu" class="menu-btn">В главное меню</button>
  </nav>
</div>

<div id="victory" class="screen result-screen hidden">
  <h2 class="subtitle result-title">ПОБЕДА</h2>
  <p class="run-result">Время забега: <span id="victory-time">0:00</span></p>
  <nav class="menu-buttons">
    <button id="btn-again" class="menu-btn">Ещё раз</button>
    <button id="btn-victory-menu" class="menu-btn">В главное меню</button>
  </nav>
</div>

<div id="gameover" class="screen result-screen hidden">
  <h2 class="subtitle result-title">ПОРАЖЕНИЕ</h2>
  <p class="run-result">Продержался: <span id="defeat-time">0:00</span></p>
  <nav class="menu-buttons">
    <button id="btn-restart" class="menu-btn">Ещё раз</button>
    <button id="btn-gameover-menu" class="menu-btn">В главное меню</button>
  </nav>
</div>

<script src="js/input.js"></script>
<script src="js/bullet.js"></script>
<script src="js/shard.js"></script>
<script src="js/enemy.js"></script>
<script src="js/waves.js"></script>
<script src="js/ship.js"></script>
<script src="js/hud.js"></script>
<script src="js/settings.js"></script>
<script src="js/game.js"></script>
</body>
</html>
